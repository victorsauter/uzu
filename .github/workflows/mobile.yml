name: mobile

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'api/openapi.json'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'api/openapi.json'
      - '.github/workflows/mobile.yml'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      # The client is generated from api/openapi.json (ADR 0007): fail when the committed one is stale.
      - name: Check that the API client is up to date
        run: |
          npm run api:generate
          if ! git diff --exit-code -- src/api/schema.d.ts; then
            echo "::error file=mobile/src/api/schema.d.ts::The API client is stale. Run 'npm run api:generate' in mobile/ and commit the result."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test -- --ci
